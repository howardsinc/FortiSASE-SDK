
config system global
    set hostname "spoke-1"
    set alias "FortiGate-ARM64-AWS"
    set timezone "US/Pacific"
    set admin-sport 10443
    set admintimeout 480
    set gui-auto-upgrade-setup-warning disable
end
config system admin
    edit "admin"
        set password "FortiSASE-OnRamp-2026!"
    next
end
config system fortiguard
    set auto-firmware-upgrade disable
end



config firewall policy
    purge
y
end

config system interface
    edit "port1"
        set alias "WAN"
        set mode static
        set ip 10.200.1.10 255.255.255.0
        set allowaccess ping https ssh fgfm
        set role wan
        set mtu-override enable
        set mtu 9001
    next
    edit "port2"
        set alias "LAN"
        set ip 10.200.10.10 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set mtu-override enable
        set mtu 9001
    next
end

config system zone
    edit "LAN_ZONE"
        set interface "port2"
        set intrazone allow
    next
end


config vpn ipsec phase1-interface
    edit "BOR_Primary"
        set type ddns
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 5 14
        set network-overlay enable
        set network-id 0
        set transport auto
        set fortinet-esp enable
        set dpd on-idle
        set remotegw-ddns "ipsec-<tenant>-dfw-f3.prod.fortisase.com"
        set psksecret <TUNNEL_PSK>
    next
    edit "BOR_Secondary"
        set type ddns
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 5 14
        set network-overlay enable
        set network-id 0
        set transport auto
        set fortinet-esp enable
        set dpd on-idle
        set remotegw-ddns "ipsec-<tenant>-mia-f3.prod.fortisase.com"
        set psksecret <TUNNEL_PSK>
    next
end

config vpn ipsec phase2-interface
    edit "BOR_Primary"
        set phase1name "BOR_Primary"
        set proposal aes256-sha256
        set dhgrp 5 14
    next
    edit "BOR_Secondary"
        set phase1name "BOR_Secondary"
        set proposal aes256-sha256
        set dhgrp 5 14
    next
end

config firewall address
    edit "spoke-1-LAN"
        set subnet 10.200.10.0 255.255.255.0
    next
    edit "BOR_Primary_PUBLIC"
        set type fqdn
        set allow-routing enable
        set fqdn "ipsec-<tenant>-dfw-f3.prod.fortisase.com"
    next
    edit "BOR_Secondary_PUBLIC"
        set type fqdn
        set allow-routing enable
        set fqdn "ipsec-<tenant>-mia-f3.prod.fortisase.com"
    next
    edit "RFC1918_10"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "RFC1918_172"
        set subnet 172.16.0.0 255.240.0.0
    next
    edit "RFC1918_192"
        set subnet 192.168.0.0 255.255.0.0
    next
end
config firewall addrgrp
    edit "RFC1918"
        set member "RFC1918_10" "RFC1918_172" "RFC1918_192"
    next
end


config router static
    edit 1
        set gateway 10.200.1.1
        set distance 20
        set device "port1"
        set comment "Floating WAN default (fallback; primary via on-ramps)"
    next
    edit 5
        set dst 172.16.0.1 255.255.255.255
        set device "BOR_Primary"
        set comment "BOR Primary node (BGP peer)"
    next
    edit 6
        set dst 172.16.8.1 255.255.255.255
        set device "BOR_Secondary"
        set comment "BOR Secondary node (BGP peer)"
    next
    edit 20
        set dstaddr "BOR_Primary_PUBLIC"
        set gateway 10.200.1.1
        set device "port1"
        set comment "Primary BOR PoP public via WAN"
    next
    edit 21
        set dstaddr "BOR_Secondary_PUBLIC"
        set gateway 10.200.1.1
        set device "port1"
        set comment "Secondary BOR PoP public via WAN"
    next
    edit 10
        set dst 203.0.113.1 255.255.255.255
        set gateway 10.200.1.1
        set device "port1"
        set comment "Bastion / management return path (trusted host)"
    next
end


config router prefix-list
    edit "PL_LAN_LOCAL"
        config rule
            edit 1
                set prefix 10.200.10.0 255.255.255.0
            next
        end
    next
end
config router route-map
    edit "RM_OUT_PRIMARY"
        config rule
            edit 1
                set match-ip-address "PL_LAN_LOCAL"
                set set-community "65001:20" "65001:1001"
                
                set set-local-preference 195
            next
            edit 99
            next
        end
    next
    edit "RM_OUT_SECONDARY"
        config rule
            edit 1
                set match-ip-address "PL_LAN_LOCAL"
                set set-community "65001:10" "65001:1001"
                
                set set-local-preference 200
            next
            edit 99
            next
        end
    next
    edit "RM_OUT_FAIL"
        config rule
            edit 1
                set match-ip-address "PL_LAN_LOCAL"
                set set-community "65001:64911" "65001:1001"
                set set-local-preference 50
            next
            edit 99
            next
        end
    next
end

config router bgp
    set as 65001
    set router-id 10.30.1.100
    set keepalive-timer 2
    set holdtime-timer 6
    set ibgp-multipath enable
    set recursive-next-hop enable
    set scan-time 5
    set graceful-restart enable
    config neighbor
        edit "172.16.0.1"
            set interface "BOR_Primary"
            set update-source "BOR_Primary"
            set remote-as 65001
            set advertisement-interval 1
            set connect-timer 1
            set capability-graceful-restart enable
            set link-down-failover enable
            set next-hop-self enable
            set soft-reconfiguration enable
            set route-map-out "RM_OUT_FAIL"
            set route-map-out-preferable "RM_OUT_PRIMARY"
            set send-community both
        next
        edit "172.16.8.1"
            set interface "BOR_Secondary"
            set update-source "BOR_Secondary"
            set remote-as 65001
            set advertisement-interval 1
            set connect-timer 1
            set capability-graceful-restart enable
            set link-down-failover enable
            set next-hop-self enable
            set soft-reconfiguration enable
            set route-map-out "RM_OUT_FAIL"
            set route-map-out-preferable "RM_OUT_SECONDARY"
            set send-community both
        next
    end
    config network
        edit 1
            set prefix 10.200.10.0 255.255.255.0
        next
    end
end

config system sdwan
    set status enable
    config zone
        edit "SDWAN_ZONE"
        next
        edit "Underlay_ZONE"
        next
    end
    config members
        edit 1
            set interface "BOR_Primary"
            set zone "SDWAN_ZONE"
        next
        edit 2
            set interface "BOR_Secondary"
            set zone "SDWAN_ZONE"
        next
        edit 3
            set interface "port1"
            set zone "Underlay_ZONE"
            set gateway 10.200.1.1
        next
    end
    
    config health-check

        edit "HC_Primary"
            set server "64.6.64.6"

            set failtime 2
            set recoverytime 3
            set update-static-route disable
            set members 1
            config sla
                edit 1
                    set link-cost-factor latency jitter packet-loss
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
        edit "HC_Secondary"
            set server "64.6.65.6"

            set failtime 2
            set recoverytime 3
            set update-static-route disable
            set members 2
            config sla
                edit 1
                    set link-cost-factor latency jitter packet-loss
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
    end

    config neighbor
        edit "172.16.0.1"
            set member 1
            set health-check "HC_Primary"
            set sla-id 1
        next
        edit "172.16.8.1"
            set member 2
            set health-check "HC_Secondary"
            set sla-id 1
        next
    end
end

config firewall policy
    edit 1
        set name "LAN to BOR (SIA)"
        set srcintf "LAN_ZONE"
        set dstintf "SDWAN_ZONE"
        set srcaddr "spoke-1-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 2
        set name "BOR to LAN (return)"
        set srcintf "SDWAN_ZONE"
        set dstintf "LAN_ZONE"
        set srcaddr "all"
        set dstaddr "spoke-1-LAN"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "LAN to Underlay (fallback)"
        set srcintf "LAN_ZONE"
        set dstintf "Underlay_ZONE"
        set srcaddr "spoke-1-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end



config firewall shaper traffic-shaper
    edit "100_MBPS_UP"
        set guaranteed-bandwidth 0
        set maximum-bandwidth 100000
        set bandwidth-unit kbps
    next
    edit "100_MBPS_DOWN"
        set guaranteed-bandwidth 0
        set maximum-bandwidth 100000
        set bandwidth-unit kbps
    next
end
config firewall shaping-policy
    edit 1
        set name "BOR_OUTBOUND_SHAPER"
        set service "ALL"
        set srcaddr "all"
        set dstaddr "all"
        set dstintf "SDWAN_ZONE"
        set traffic-shaper "100_MBPS_UP"
        set traffic-shaper-reverse "100_MBPS_DOWN"
    next
end


config system sdwan
    config service
        edit 1
            set name "BOR_Private_Access"
            set mode sla
            set dst "RFC1918"
            
            set tie-break cfg-order

            set priority-members 2 1 

            config sla
                edit "HC_Secondary"
                    set id 1
                next
                edit "HC_Primary"
                    set id 1
                next
            end
        next
        edit 2
            set name "INET_via_BOR"
            set mode sla
            set dst "all"
            
            set tie-break cfg-order
            set priority-members 1 2 

            config sla
                edit "HC_Primary"
                    set id 1
                next
                edit "HC_Secondary"
                    set id 1
                next
            end
        next
        edit 5
            set name "Underlay_fallback"
            set dst "all"
            set priority-members 3
        next
    end
end
