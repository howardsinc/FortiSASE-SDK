
config system global
    set hostname "hub-5"
    set alias "FortiGate-ARM64-AWS"
    set timezone "US/Pacific"
    set admin-sport 10443
    set admintimeout 480
    set gui-auto-upgrade-setup-warning disable
end
config system admin
    edit "admin"
        set password "FortiSASE-OnRamp-2026!"
    next
end
config system fortiguard
    set auto-firmware-upgrade disable
end


# green-field: purge default firewall policies before adding ours
config firewall policy
    purge
end

config system interface
    edit "port1"
        set alias "WAN"
        set mode static
        set ip 10.200.5.10 255.255.255.0
        set allowaccess ping https ssh fgfm
        set role wan
        set mtu-override enable
        set mtu 9001
    next
    edit "port2"
        set alias "LAN"
        set ip 10.200.50.10 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set mtu-override enable
        set mtu 9001
    next
end


config system zone
    edit "LAN_ZONE"
        set interface "port2"
        set intrazone allow
    next
end


config vpn ipsec phase1-interface
    edit "SASE_Hub"
        set type dynamic
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set add-route disable
        set dpd on-idle
        set dpd-retryinterval 60
        set dhgrp 20 15 14
        set network-overlay enable
        set network-id 1
        set transport auto
        set ipv4-start-ip 10.10.50.1
        set ipv4-end-ip 10.10.50.252
        set ipv4-netmask 255.255.255.0
        set proposal aes256-sha256 aes256-sha384 aes256-sha512 aes128-sha256
        set psksecret <TUNNEL_PSK>
    next
    edit "BOR_Primary"
        set type ddns
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 5 14
        set network-overlay enable
        set network-id 0
        set transport auto
        set fortinet-esp enable
        set dpd on-idle
        set remotegw-ddns "ipsec-<tenant>-dfw-f3.prod.fortisase.com"
        set psksecret <TUNNEL_PSK>
    next
    edit "BOR_Secondary"
        set type ddns
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal aes256-sha256
        set dhgrp 5 14
        set network-overlay enable
        set network-id 0
        set transport auto
        set fortinet-esp enable
        set dpd on-idle
        set remotegw-ddns "ipsec-<tenant>-mia-f3.prod.fortisase.com"
        set psksecret <TUNNEL_PSK>
    next
end

config vpn ipsec phase2-interface
    edit "SASE_Hub"
        set phase1name "SASE_Hub"
        set proposal aes256-sha256 aes256gcm
        set dhgrp 20 15 14
        set keylifeseconds 86400
    next
    edit "BOR_Primary"
        set phase1name "BOR_Primary"
        set proposal aes256-sha256
        set dhgrp 5 14
    next
    edit "BOR_Secondary"
        set phase1name "BOR_Secondary"
        set proposal aes256-sha256
        set dhgrp 5 14
    next
end


config system interface
    edit "SASE_Hub"
        set ip 10.10.50.253 255.255.255.255
        set remote-ip 10.10.50.254 255.255.255.0
        set allowaccess ping
    next
end

config firewall address
    edit "hub-5-LAN"
        set subnet 10.200.50.0 255.255.255.0
    next
    edit "BOR_Primary_PUBLIC"
        set type fqdn
        set allow-routing enable
        set fqdn "ipsec-<tenant>-dfw-f3.prod.fortisase.com"
    next
    edit "BOR_Secondary_PUBLIC"
        set type fqdn
        set allow-routing enable
        set fqdn "ipsec-<tenant>-mia-f3.prod.fortisase.com"
    next
    edit "RFC1918_10"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "RFC1918_172"
        set subnet 172.16.0.0 255.240.0.0
    next
    edit "RFC1918_192"
        set subnet 192.168.0.0 255.255.0.0
    next
end


config router static
    edit 1
        set gateway 10.200.5.1
        set distance 20
        set device "port1"
        set comment "Floating WAN default (fallback; SIA default via on-ramps)"
    next
    edit 20
        set dstaddr "BOR_Primary_PUBLIC"
        set gateway 10.200.5.1
        set device "port1"
        set comment "Primary BOR PoP public via WAN"
    next
    edit 21
        set dstaddr "BOR_Secondary_PUBLIC"
        set gateway 10.200.5.1
        set device "port1"
        set comment "Secondary BOR PoP public via WAN"
    next
    edit 10
        set dst 203.0.113.1 255.255.255.255
        set gateway 10.200.5.1
        set device "port1"
        set comment "Bastion / management return path"
    next
end



config router community-list
    edit "CL_ONRAMP_1"
        config rule
            edit 1
                set action permit
                set match "65001:10"
            next
        end
    next
    edit "CL_ONRAMP_2"
        config rule
            edit 1
                set action permit
                set match "65001:20"
            next
        end
    next
    edit "CL_ONRAMP_3"
        config rule
            edit 1
                set action permit
                set match "65001:30"
            next
        end
    next
    edit "CL_ONRAMP_4"
        config rule
            edit 1
                set action permit
                set match "65001:40"
            next
        end
    next
    edit "CL_ONRAMP_5"
        config rule
            edit 1
                set action permit
                set match "65001:50"
            next
        end
    next
    edit "CL_ONRAMP_6"
        config rule
            edit 1
                set action permit
                set match "65001:60"
            next
        end
    next
    edit "CL_ONRAMP_7"
        config rule
            edit 1
                set action permit
                set match "65001:70"
            next
        end
    next
    edit "CL_ONRAMP_8"
        config rule
            edit 1
                set action permit
                set match "65001:80"
            next
        end
    next
    edit "CL_ONRAMP_FAIL"
        config rule
            edit 1
                set action permit
                set match "65001:64911"
            next
        end
    next
end
config router route-map
    edit "RM_FABRIC_IN"
        config rule
            edit 101
                set match-community "CL_ONRAMP_1"
                set set-local-preference 200
                set set-priority 100
            next
            edit 102
                set match-community "CL_ONRAMP_2"
                set set-local-preference 195
                set set-priority 105
            next
            edit 103
                set match-community "CL_ONRAMP_3"
                set set-local-preference 190
                set set-priority 110
            next
            edit 104
                set match-community "CL_ONRAMP_4"
                set set-local-preference 185
                set set-priority 115
            next
            edit 105
                set match-community "CL_ONRAMP_5"
                set set-local-preference 180
                set set-priority 120
            next
            edit 106
                set match-community "CL_ONRAMP_6"
                set set-local-preference 175
                set set-priority 125
            next
            edit 107
                set match-community "CL_ONRAMP_7"
                set set-local-preference 170
                set set-priority 130
            next
            edit 108
                set match-community "CL_ONRAMP_8"
                set set-local-preference 165
                set set-priority 135
            next
            edit 190
                set match-community "CL_ONRAMP_FAIL"
                set set-local-preference 50
                set set-priority 300
            next
            edit 999
            next
        end
    next
end


config router bgp
    set as 65001
    set router-id 10.30.1.105
    set keepalive-timer 2
    set holdtime-timer 6
    set ibgp-multipath enable
    set additional-path enable
    set additional-path-select 4
    set graceful-restart enable
    config neighbor-group
        edit "SASE_Hub"
            set interface "SASE_Hub"
            set remote-as 65001
            set route-reflector-client enable
            set route-map-in "RM_FABRIC_IN"
            set next-hop-self enable
            set additional-path send
            set adv-additional-path 4
            set capability-graceful-restart enable
            set link-down-failover enable
            set soft-reconfiguration enable
        next
    end
    config neighbor-range
        edit 1
            set prefix 10.10.50.0 255.255.255.0
            set neighbor-group "SASE_Hub"
        next
    end
    config network
        edit 1
            set prefix 10.10.50.0 255.255.255.0
        next
        edit 2
            set prefix 10.200.50.0 255.255.255.0
        next
    end
end

config system sdwan
    set status enable
    config zone
        edit "SDWAN_ZONE"
        next
        edit "Underlay_ZONE"
        next
    end
    config members
        edit 1
            set interface "BOR_Primary"
            set zone "SDWAN_ZONE"
        next
        edit 2
            set interface "BOR_Secondary"
            set zone "SDWAN_ZONE"
        next
        edit 3
            set interface "port1"
            set zone "Underlay_ZONE"
            set gateway 10.200.5.1
        next
        
        edit 4
            set interface "SASE_Hub"
            set zone "SDWAN_ZONE"
        next
    end
    
    config health-check
        edit "SIA_Health"
            
            set server "64.6.64.6" "64.6.65.6" 

            set failtime 2
            set recoverytime 3
            set update-static-route disable
            set members 1 2 

            config sla
                edit 1
                    set link-cost-factor latency jitter packet-loss
                    set latency-threshold 250
                    set jitter-threshold 50
                    set packetloss-threshold 5
                next
            end
        next
    end
end

config firewall policy
    
    edit 1
        set name "SDWAN-Hairpin (spoke-to-spoke)"
        set srcintf "SDWAN_ZONE"
        set dstintf "SDWAN_ZONE"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    
    edit 2
        set name "LAN to BOR Private (east-west, no SNAT)"
        set srcintf "LAN_ZONE"
        set dstintf "SDWAN_ZONE"
        set srcaddr "hub-5-LAN"
        set dstaddr "RFC1918_10" "RFC1918_172" "RFC1918_192"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "LAN to BOR Internet (SIA, SNAT)"
        set srcintf "LAN_ZONE"
        set dstintf "SDWAN_ZONE"
        set srcaddr "hub-5-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
    
    edit 4
        set name "BOR to LAN (return)"
        set srcintf "SDWAN_ZONE"
        set dstintf "LAN_ZONE"
        set srcaddr "all"
        set dstaddr "hub-5-LAN"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 6
        set name "LAN to Underlay (fallback)"
        set srcintf "LAN_ZONE"
        set dstintf "Underlay_ZONE"
        set srcaddr "hub-5-LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end



config firewall shaper traffic-shaper
    edit "100_MBPS_UP"
        set guaranteed-bandwidth 0
        set maximum-bandwidth 100000
        set bandwidth-unit kbps
    next
    edit "100_MBPS_DOWN"
        set guaranteed-bandwidth 0
        set maximum-bandwidth 100000
        set bandwidth-unit kbps
    next
end
config firewall shaping-policy
    edit 1
        set name "BOR_OUTBOUND_SHAPER"
        set service "ALL"
        set srcaddr "all"
        set dstaddr "all"
        set dstintf "SDWAN_ZONE"
        set traffic-shaper "100_MBPS_UP"
        set traffic-shaper-reverse "100_MBPS_DOWN"
    next
end


config system sdwan
    config service
        
        edit 1
            set name "Private-Access"
            set dst "RFC1918_10" "RFC1918_172" "RFC1918_192"
            set priority-members 4
            set tie-break fib-best-match
        next
        edit 2
            set name "INET_via_BOR"
            set mode priority
            set dst "all"
            set health-check "SIA_Health"
            set link-cost-factor packet-loss
            
            set tie-break cfg-order
            set priority-members 1 2 

        next
        edit 4
            set name "Underlay_fallback"
            set dst "all"
            set priority-members 3
        next
    end
end
